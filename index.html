<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STA Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header dengan Tombol Garis Tiga -->
        <div class="header-nav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h1 style="margin: 0; text-align: left;">STA FINDER</h1>
            <button onclick="toggleMenu()" class="hamburger-btn">☰</button>
    </div>
            <div class="card">
            <div class="project-card">
                <div class="project-title">Proyek Hankam Lingkar Sepaku 4</div>
            </div>
            <h2>Status Sistem</h2>
            <p>GPS : <span id="gpsStatus">Belum aktif</span></p>
            <p>CSV : <span id="csvStatus">Belum dimuat</span></p>
        </div>

        <div class="card">
            <h2>Lokasi Saat Ini</h2>
            <p>Latitude</p>
            <div class="nilai" id="lat">-</div>
            <p>Longitude</p>
            <div class="nilai" id="lon">-</div>
            <p>Akurasi GPS</p>
            <div class="nilai" id="akurasi">-</div>
            
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;">
            
            <p>Jarak ke STA Terdekat</p>
            <div class="nilai" id="jarak">-</div>
            <p>Arah ke STA Terdekat</p>
            <div class="nilai" id="arah">-</div>
        </div>

        <div class="card">
            <h2>STA Terdekat</h2>
            <div id="sta" class="sta">-</div>
        </div>

        <div class="card">
            <h2>Update Terakhir</h2>
            <div id="waktu">-</div>
        </div>

        <button id="btnLokasi" onclick="toggleLokasi()">MULAI PELACAKAN</button>
    </div>

    <script src="script.js"></script>

    <!-- Sidebar Menu Geser -->
    <div id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h3>Pengaturan</h3>
            <button onclick="toggleMenu()" class="close-btn">&times;</button>
        </div>
        <div class="menu-content">
            <!-- Tombol Mode Gelap -->
            <button id="btnDarkMode" onclick="toggleDarkMode()" class="menu-item" style="margin-bottom: 10px;">Mode Gelap</button>
            
            <!-- 1. Pencegah Layar Mati -->
            <button id="btnWakeLock" onclick="toggleWakeLock()" class="menu-item" style="margin-bottom: 10px;">Layar Nyala: MATI</button>
            
            <!-- 2. Peringatan Getar Dekat STA -->
            <button id="btnVibration" onclick="toggleVibration()" class="menu-item" style="margin-bottom: 10px;">Getar Dekat STA: MATI</button>
            
            <!-- 4. Ekspor Riwayat CSV -->
            <button onclick="exportHistoryCSV()" class="menu-item" style="background: #2e7d32; color: white;">Ekspor Riwayat CSV</button>
        </div>
    </div>

</body>
</html>
